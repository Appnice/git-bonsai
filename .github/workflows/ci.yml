name: CI
on:
  push:
  workflow_dispatch:
    inputs:
      accept:
        description: Regenerate the golden snapshots and commit them
        type: boolean
        default: false
      preview:
        description: Render the pad-mix variants of the live tree
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        env:
          INSTA_UPDATE: ${{ inputs.accept && 'always' || 'no' }}
        run: cargo test
      - name: Commit accepted snapshots
        if: ${{ inputs.accept }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no snapshot changes"; exit 0; fi
          git commit -m "test: accept the regenerated golden snapshots"
          git push

  preview:
    if: ${{ inputs.preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render the variants
        run: |
          mkdir -p preview
          curl -fsSL -o preview/live.json https://raw.githubusercontent.com/seven-lynx/seven-lynx/main/bonsai/state.json
          for v in patches scatter bands; do
            python3 -c "import json,sys;d=json.load(open('preview/live.json'));d['pad_mix']=sys.argv[1];json.dump(d,open('preview/'+sys.argv[1]+'.json','w'))" "$v"
            cargo run --release --quiet -- render --state "preview/$v.json" --theme dark --out "preview/$v-dark.svg"
            cargo run --release --quiet -- render --state "preview/$v.json" --theme light --out "preview/$v-light.svg"
          done
          ls -l preview
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "preview: pad mix variants"
          git push origin HEAD:preview
