name: CI
on:
  push:
  workflow_dispatch:
    inputs:
      accept:
        description: Regenerate the golden snapshots and commit them
        type: boolean
        default: false
      preview:
        description: Grow a real tree for the login and print the cell map
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        env:
          INSTA_UPDATE: ${{ inputs.accept && 'always' || 'no' }}
        run: cargo test
      - name: Commit accepted snapshots
        if: ${{ inputs.accept }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no snapshot changes"; exit 0; fi
          git commit -m "test: accept the regenerated golden snapshots"
          git push

  preview:
    if: ${{ inputs.preview }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Grow the live tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p preview
          curl -fsSL -o preview/state.json \
            https://raw.githubusercontent.com/seven-lynx/seven-lynx/main/bonsai/state.json
          cargo run --release -- grow --login seven-lynx --state preview/state.json --out preview
      - name: Cell map
        run: cargo run --release -- debug --state preview/state.json
      - name: Languages per branch
        run: python3 -c "import json;d=json.load(open('preview/state.json'));[print(b['name'],b.get('lang'),'->',[(l['name'],l['bytes']) for l in b.get('langs',[])]) for b in d['branches']]"
      - uses: actions/upload-artifact@v4
        with:
          name: bonsai-preview
          path: preview/
