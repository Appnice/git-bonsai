# Copy to .github/workflows/bonsai.yml in your profile repo (github.com/<you>/<you>).
name: Git Bonsai
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, after the UTC day closes
  workflow_dispatch:
permissions:
  contents: write
concurrency: bonsai
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appnice/git-bonsai@v1
