[package]
name = "git-bonsai"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Pixel bonsai grown from a GitHub account's public activity, one day at a time"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "macros", "parsing", "formatting"] }

[dev-dependencies]
insta = "1"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
